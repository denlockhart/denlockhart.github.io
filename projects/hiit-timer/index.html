<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>HIIT Timer</title>
  <meta name="description" content="Configurable interval timer with work and rest cues.">
  <meta name="theme-color" content="#14110e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HIIT Timer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header>
    <h1>HIIT Timer</h1>
    <p id="interval-summary">20 seconds on · 30 seconds off</p>
  </header>

  <main>
    <section class="panel intervals-panel">
      <h2>Intervals</h2>
      <div class="interval-row">
        <label class="interval-field">
          <span>Work (seconds)</span>
          <div class="stepper">
            <button type="button" class="step-btn" data-target="work" data-delta="-5" aria-label="Decrease work time">−</button>
            <input id="work-input" type="number" min="5" max="600" value="20" inputmode="numeric">
            <button type="button" class="step-btn" data-target="work" data-delta="5" aria-label="Increase work time">+</button>
          </div>
        </label>
        <label class="interval-field">
          <span>Rest (seconds)</span>
          <div class="stepper">
            <button type="button" class="step-btn" data-target="rest" data-delta="-5" aria-label="Decrease rest time">−</button>
            <input id="rest-input" type="number" min="5" max="600" value="30" inputmode="numeric">
            <button type="button" class="step-btn" data-target="rest" data-delta="5" aria-label="Increase rest time">+</button>
          </div>
        </label>
      </div>
      <div class="preset-row" aria-label="Quick presets">
        <button type="button" class="preset-btn" data-work="20" data-rest="30">20 / 30</button>
        <button type="button" class="preset-btn" data-work="30" data-rest="40">30 / 40</button>
        <button type="button" class="preset-btn" data-work="40" data-rest="60">40 / 60</button>
      </div>
    </section>

    <section class="panel timer-panel" aria-live="polite">
      <p class="phase-label" id="phase-label">Ready</p>
      <p class="timer-display" id="timer-display">00:20</p>
      <p class="round-label" id="round-label">Round 1 of 8</p>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <section class="panel controls-panel">
      <div class="actions">
        <button type="button" class="primary" id="btn-start">Start</button>
        <button type="button" id="btn-pause" disabled>Pause</button>
        <button type="button" id="btn-reset">Reset</button>
      </div>
    </section>

    <section class="panel settings-panel">
      <h2>Settings</h2>
      <label>
        Rounds
        <input id="rounds-input" type="number" min="1" max="99" value="8" inputmode="numeric">
      </label>
      <label class="checkbox-row">
        <input id="sound-toggle" type="checkbox" checked>
        Announce work and rest
      </label>
    </section>

    <section class="panel install-panel">
      <h2>Phone / share</h2>
      <p class="install-hint" id="install-hint">
        Use this link: <strong>www.denlockhart.com/projects/hiit-timer/</strong>
        (include <strong>www</strong>). On iPhone open it in <strong>Safari</strong>, then Share → Add to Home Screen.
      </p>
      <div class="actions">
        <button type="button" class="primary" id="btn-share">Share link</button>
        <button type="button" id="btn-copy-link">Copy link</button>
      </div>
      <p class="install-status" id="install-status" role="status"></p>
    </section>
  </main>

  <footer>
    <p><a href="/">denlockhart.com</a></p>
  </footer>

  <script src="app.js?v=20"></script>
</body>
</html>
